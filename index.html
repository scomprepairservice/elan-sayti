<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sumqayıt Elan Portalı</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#10B981',
                        dark: '#0F172A'
                    },
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif']
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-50 font-sans text-slate-800 antialiased min-h-screen flex flex-col justify-between">

    <!-- Header -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-40 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <div class="flex items-center space-x-3 cursor-pointer" onclick="resetFilters()">
                <div class="bg-primary text-white w-12 h-12 rounded-2xl flex items-center justify-center text-xl font-black shadow-lg shadow-primary/30">
                    S
                </div>
                <div>
                    <h1 class="text-xl font-extrabold text-slate-900 tracking-tight">Sumqayıt<span class="text-primary">Elan</span></h1>
                    <div class="flex items-center space-x-2 text-[11px] text-slate-500 font-medium flex-wrap">
                        <span><i class="fa-solid fa-users text-emerald-500"></i> Aktiv: <strong id="activeUsersCount" class="text-slate-700">1</strong></span>
                        <span>•</span>
                        <span><i class="fa-solid fa-eye text-blue-500"></i> Baxış: <strong id="totalViewsCount" class="text-slate-700">0</strong></span>
                        <span>•</span>
                        <a href="https://wa.me/994505458586" target="_blank" class="text-emerald-600 font-bold hover:underline">
                            <i class="fa-brands fa-whatsapp"></i> +994 50 545 85 86
                        </a>
                    </div>
                </div>
            </div>

            <!-- Actions -->
            <div class="flex items-center space-x-3">
                <button onclick="openFavoritesModal()" class="relative p-2.5 rounded-xl border border-slate-200 hover:bg-slate-100 text-slate-700 transition">
                    <i class="fa-solid fa-heart text-rose-500"></i>
                    <span id="favCount" class="absolute -top-1 -right-1 bg-rose-500 text-white text-[10px] w-5 h-5 rounded-full flex items-center justify-center font-bold">0</span>
                </button>
                
                <div id="addAdBtnContainer"></div>
                <div id="authSection">
                    <button onclick="loginWithGoogle()" class="p-2.5 rounded-xl border border-slate-200 hover:bg-slate-100 text-slate-700 transition flex items-center space-x-2 text-xs font-semibold" title="Google ilə Admin Girişi">
                        <i class="fa-brands fa-google text-red-500"></i>
                        <span class="hidden sm:inline">Admin Girişi</span>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
        
        <!-- Search & Filter Bar -->
        <div class="bg-white rounded-2xl p-4 sm:p-6 shadow-sm border border-slate-200 mb-8">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                        <i class="fa-solid fa-magnifying-glass"></i>
                    </span>
                    <input type="text" id="searchInput" oninput="filterAds()" placeholder="Açar söz (məs: Ev, Maşın...)" class="w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-primary text-sm">
                </div>

                <div>
                    <select id="categorySelect" onchange="filterAds()" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-primary text-sm">
                        <option value="">Bütün Kateqoriyalar</option>
                        <option value="Daşınmaz əmlak">Daşınmaz əmlak</option>
                        <option value="Avtomobillər">Avtomobillər</option>
                        <option value="Elektronika">Elektronika</option>
                        <option value="İş elanları">İş elanları</option>
                        <option value="Xidmətlər">Xidmətlər</option>
                    </select>
                </div>

                <div>
                    <select id="sortSelect" onchange="filterAds()" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-primary text-sm">
                        <option value="newest">Ən yenilər</option>
                        <option value="price-asc">Ucuzdan bahaya</option>
                        <option value="price-desc">Bahadan ucuza</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- Category Tabs -->
        <div class="flex space-x-2 overflow-x-auto pb-4 mb-6 no-scrollbar">
            <button onclick="setCategoryTab('')" class="cat-tab active px-5 py-2.5 rounded-xl text-sm font-semibold whitespace-nowrap transition bg-primary text-white shadow-md shadow-primary/20">Hamısı</button>
            <button onclick="setCategoryTab('Daşınmaz əmlak')" class="cat-tab px-5 py-2.5 rounded-xl text-sm font-semibold whitespace-nowrap transition bg-white border border-slate-200 text-slate-700 hover:bg-slate-100">🏠 Əmlak</button>
            <button onclick="setCategoryTab('Avtomobillər')" class="cat-tab px-5 py-2.5 rounded-xl text-sm font-semibold whitespace-nowrap transition bg-white border border-slate-200 text-slate-700 hover:bg-slate-100">🚗 Maşınlar</button>
            <button onclick="setCategoryTab('Elektronika')" class="cat-tab px-5 py-2.5 rounded-xl text-sm font-semibold whitespace-nowrap transition bg-white border border-slate-200 text-slate-700 hover:bg-slate-100">💻 Elektronika</button>
            <button onclick="setCategoryTab('İş elanları')" class="cat-tab px-5 py-2.5 rounded-xl text-sm font-semibold whitespace-nowrap transition bg-white border border-slate-200 text-slate-700 hover:bg-slate-100">💼 İş elanları</button>
            <button onclick="setCategoryTab('Xidmətlər')" class="cat-tab px-5 py-2.5 rounded-xl text-sm font-semibold whitespace-nowrap transition bg-white border border-slate-200 text-slate-700 hover:bg-slate-100">🛠️ Xidmətlər</button>
        </div>

        <!-- Listings Grid -->
        <div id="listingsGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6"></div>

        <!-- Empty state -->
        <div id="emptyState" class="hidden text-center py-16">
            <div class="w-20 h-20 bg-slate-100 rounded-full flex items-center justify-center mx-auto text-slate-400 text-2xl mb-4">
                <i class="fa-solid fa-box-open"></i>
            </div>
            <h3 class="text-lg font-bold text-slate-800">Elan tapılmadı</h3>
            <p class="text-slate-500 text-sm mt-1">Axtarış kriteriyalarını dəyişə bilərsiniz.</p>
        </div>

    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-200 mt-16 py-8">
        <div class="max-w-7xl mx-auto px-4 text-center text-slate-500 text-sm">
            <p>© 2026 Sumqayıt Elan Portalı. Bütün hüquqlar qorunur. Əlaqə: <a href="tel:+994505458586" class="text-primary font-bold">+994 50 545 85 86</a></p>
        </div>
    </footer>

    <!-- ADD/EDIT AD MODAL -->
    <div id="addModal" class="fixed inset-0 z-50 bg-slate-900/50 backdrop-blur-sm hidden flex items-center justify-center p-4" onclick="if(event.target === this) closeAddModal()">
        <div class="bg-white rounded-3xl max-w-lg w-full p-6 sm:p-8 shadow-2xl overflow-y-auto max-h-[90vh]">
            <div class="flex justify-between items-center mb-6">
                <h3 id="modalTitleText" class="text-xl font-bold text-slate-900">Yeni Elan Yerləşdir (Admin)</h3>
                <button onclick="closeAddModal()" class="text-slate-400 hover:text-slate-600 text-xl"><i class="fa-solid fa-xmark"></i></button>
            </div>
            
            <form id="addAdForm" onsubmit="submitAd(event)" class="space-y-4">
                <input type="hidden" id="editingAdId" value="">
                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Elanın Başlığı</label>
                    <input type="text" id="adTitle" required class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-primary" placeholder="Məs: Masaüstü fərdi kompüter üçün prosessorlar">
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Kateqoriya</label>
                        <select id="adCategory" required class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-primary">
                            <option value="Daşınmaz əmlak">Daşınmaz əmlak</option>
                            <option value="Avtomobillər">Avtomobillər</option>
                            <option value="Elektronika">Elektronika</option>
                            <option value="İş elanları">İş elanları</option>
                            <option value="Xidmətlər">Xidmətlər</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Qiymət (AZN)</label>
                        <input type="number" id="adPrice" required class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-primary" placeholder="5">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Əlaqə Nömrəsi</label>
                        <input type="text" id="adPhone" value="+994505458586" required class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-primary" placeholder="+994505458586">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Şəkil Seç (Bir-bir və ya çoxlu seçə bilərsiniz)</label>
                        <input type="file" id="adImageFiles" multiple accept="image/*" onchange="handleNewFiles(this)" class="w-full px-2 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs text-slate-500 cursor-pointer">
                    </div>
                </div>

                <!-- Preview container for images -->
                <div id="imagePreviewContainer">
                    <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Seçilmiş Şəkillər (Silmək üçün üzərinə basın)</label>
                    <div id="previewThumbnails" class="flex flex-wrap gap-2 p-2 bg-slate-50 rounded-xl border border-slate-200 max-h-40 overflow-y-auto"></div>
                </div>

                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Ətraflı Məlumat (Word-dən kopyalaya bilərsiniz)</label>
                    <textarea id="adDescription" rows="6" required class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-primary whitespace-pre-line" placeholder="Word faylındakı mətnləri bura yapışdırın..."></textarea>
                </div>

                <button type="submit" class="w-full bg-primary hover:bg-emerald-600 text-white font-bold py-3.5 rounded-xl shadow-lg shadow-primary/30 transition">
                    Yadda Saxla / Dərc Et
                </button>
            </form>
        </div>
    </div>

    <!-- DETAIL MODAL -->
    <div id="detailModal" class="fixed inset-0 z-50 bg-slate-900/50 backdrop-blur-sm hidden flex items-center justify-center p-4" onclick="if(event.target === this) closeDetailModal()">
        <div class="bg-white rounded-3xl max-w-2xl w-full p-6 sm:p-8 shadow-2xl overflow-y-auto max-h-[90vh] relative">
            <button onclick="closeDetailModal()" class="absolute top-6 right-6 text-slate-400 hover:text-slate-600 text-xl z-10"><i class="fa-solid fa-xmark"></i></button>
            <div id="detailContent"></div>
        </div>
    </div>

    <!-- FULLSCREEN IMAGE VIEWER MODAL -->
    <div id="imageModal" class="fixed inset-0 z-[60] bg-black/90 hidden flex items-center justify-center p-4 cursor-pointer" onclick="closeImageModal()">
        <button onclick="closeImageModal()" class="absolute top-6 right-6 text-white text-3xl hover:text-slate-300 z-10"><i class="fa-solid fa-xmark"></i></button>
        <img id="fullscreenImg" src="" class="max-w-full max-h-[90vh] object-contain rounded-xl shadow-2xl">
    </div>

    <!-- FAVORITES MODAL -->
    <div id="favoritesModal" class="fixed inset-0 z-50 bg-slate-900/50 backdrop-blur-sm hidden flex items-center justify-center p-4" onclick="if(event.target === this) closeFavoritesModal()">
        <div class="bg-white rounded-3xl max-w-xl w-full p-6 sm:p-8 shadow-2xl overflow-y-auto max-h-[90vh]">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-xl font-bold text-slate-900">Seçilmiş Elanlar</h3>
                <button onclick="closeFavoritesModal()" class="text-slate-400 hover:text-slate-600 text-xl"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div id="favoritesList" class="space-y-4"></div>
        </div>
    </div>

    <!-- Firebase Scripts -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
        import { getFirestore, collection, getDocs, addDoc, deleteDoc, doc, getDoc, updateDoc, increment, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCwqM_2qvOX99DNTu9nAClaT9KVSSOl0h0",
            authDomain: "elanlar-ff4cb.firebaseapp.com",
            projectId: "elanlar-ff4cb",
            storageBucket: "elanlar-ff4cb.firebasestorage.app",
            messagingSenderId: "593281324616",
            appId: "1:593281324616:web:7ce0215af0bb9c5c422a7d",
            measurementId: "G-EHHSNEM0SV"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        let ads = [];
        let favorites = JSON.parse(localStorage.getItem('sumqayit_favs')) || [];
        let currentCategoryTab = '';
        let currentUser = null;
        let currentEditingImages = []; // Accumulates all selected images seamlessly

        onAuthStateChanged(auth, (user) => {
            currentUser = user;
            const authSection = document.getElementById('authSection');
            const addAdBtnContainer = document.getElementById('addAdBtnContainer');

            if (user) {
                addAdBtnContainer.innerHTML = `
                    <button onclick="openAddModal()" class="bg-primary hover:bg-emerald-600 text-white px-5 py-3 rounded-xl font-semibold shadow-lg shadow-primary/30 flex items-center space-x-2 transition transform active:scale-95 text-sm">
                        <i class="fa-solid fa-plus"></i>
                        <span>Elan Yerləşdir</span>
                    </button>
                `;
                authSection.innerHTML = `
                    <div class="flex items-center space-x-2">
                        <img src="${user.photoURL || 'https://via.placeholder.com/40'}" class="w-8 h-8 rounded-full border border-primary" title="${user.email}">
                        <button onclick="logoutGoogle()" class="p-2.5 rounded-xl border border-rose-200 hover:bg-rose-50 text-rose-600 transition text-xs font-semibold" title="Çıxış et">
                            <i class="fa-solid fa-right-from-bracket"></i>
                        </button>
                    </div>
                `;
            } else {
                addAdBtnContainer.innerHTML = '';
                authSection.innerHTML = `
                    <button onclick="loginWithGoogle()" class="p-2.5 rounded-xl border border-slate-200 hover:bg-slate-100 text-slate-700 transition flex items-center space-x-2 text-xs font-semibold" title="Google ilə Admin Girişi">
                        <i class="fa-brands fa-google text-red-500"></i>
                        <span class="hidden sm:inline">Admin Girişi</span>
                    </button>
                `;
            }
            filterAds();
        });

        window.loginWithGoogle = async function() {
            try {
                await signInWithPopup(auth, provider);
                alert("Uğurla admin olaraq daxil olundunuz!");
            } catch (error) {
                alert("Giriş xətası: " + error.message);
            }
        };

        window.logoutGoogle = async function() {
            try {
                await signOut(auth);
                alert("Admin hesabından çıxış edildi.");
            } catch (error) {
                console.error(error);
            }
        };

        async function initStats() {
            try {
                const statsRef = doc(db, "stats", "general");
                const statsDoc = await getDoc(statsRef);
                if (statsDoc.exists()) {
                    await updateDoc(statsRef, { totalViews: increment(1) });
                } else {
                    await setDoc(statsRef, { totalViews: 1 });
                }

                const updatedStats = await getDoc(statsRef);
                document.getElementById('totalViewsCount').innerText = updatedStats.data().totalViews || 1;

                const sessionId = 'user_' + Math.random().toString(36).substring(2, 9);
                const userPresenceRef = doc(db, "active_sessions", sessionId);

                await setDoc(userPresenceRef, { lastSeen: Date.now() });

                setInterval(async () => {
                    try {
                        await updateDoc(userPresenceRef, { lastSeen: Date.now() });
                    } catch(e) {
                        await setDoc(userPresenceRef, { lastSeen: Date.now() });
                    }
                }, 10000);

                onSnapshot(collection(db, "active_sessions"), (snapshot) => {
                    const now = Date.now();
                    let activeCount = 0;
                    snapshot.forEach(docSnap => {
                        const data = docSnap.data();
                        if (now - data.lastSeen < 25000) {
                            activeCount++;
                        }
                    });
                    document.getElementById('activeUsersCount').innerText = Math.max(1, activeCount);
                });
            } catch (e) {
                console.error("Stats error:", e);
            }
        }

        function listenToAds() {
            onSnapshot(collection(db, "ads"), (snapshot) => {
                ads = [];
                snapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    let imgList = data.images;
                    if (!imgList || imgList.length === 0) {
                        imgList = data.image ? [data.image] : ["https://images.unsplash.com/photo-1588702547919-26b89e033105?auto=format&fit=crop&w=600&q=80"];
                    }
                    ads.push({ id: docSnap.id, views: 0, ...data, images: imgList });
                });
                filterAds();
                updateFavCount();
            });
        }

        function readFileAsDataURL(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
                reader.readAsDataURL(file);
            });
        }

        // Handles accumulating files selected one-by-one or all together
        window.handleNewFiles = async function(input) {
            if (input.files && input.files.length > 0) {
                for (let i = 0; i < input.files.length; i++) {
                    try {
                        const base64 = await readFileAsDataURL(input.files[i]);
                        currentEditingImages.push(base64);
                    } catch(err) {
                        console.error(err);
                    }
                }
                renderEditingThumbnails();
                input.value = ''; // Reset input so the same file can be selected again if needed
            }
        };

        window.submitAd = async function(e) {
            e.preventDefault();
            if (!currentUser) {
                alert("Bu əməliyyat üçün admin kimi daxil olmalısınız!");
                return;
            }

            const editingId = document.getElementById('editingAdId').value;
            let finalImages = [...currentEditingImages];
            
            if (finalImages.length === 0) {
                finalImages = ["https://images.unsplash.com/photo-1588702547919-26b89e033105?auto=format&fit=crop&w=600&q=80"];
            }

            const adData = {
                title: document.getElementById('adTitle').value,
                category: document.getElementById('adCategory').value,
                price: Number(document.getElementById('adPrice').value),
                phone: document.getElementById('adPhone').value || "+994505458586",
                images: finalImages,
                description: document.getElementById('adDescription').value,
            };

            try {
                if (editingId) {
                    await updateDoc(doc(db, "ads", editingId), adData);
                    alert("Elan uğurla yeniləndi!");
                } else {
                    adData.views = 0;
                    await addDoc(collection(db, "ads"), adData);
                    alert("Elan uğurla əlavə olundu!");
                }
                closeAddModal();
                closeDetailModal();
            } catch (err) {
                alert("Xəta baş verdi: " + err.message);
            }
        };

        window.deleteAd = async function(id) {
            if (!currentUser) {
                alert("Bu əməliyyat üçün admin kimi daxil olmalısınız!");
                return;
            }
            if (confirm("Bu elanı silmək istədiyinizə əminsiniz?")) {
                try {
                    await deleteDoc(doc(db, "ads", id));
                    closeDetailModal();
                    alert("Elan uğurla silindi.");
                } catch (err) {
                    alert("Silinmə xətası: " + err.message);
                }
            }
        };

        window.editAd = function(id) {
            const ad = ads.find(a => a.id === id);
            if (!ad) return;

            document.getElementById('editingAdId').value = ad.id;
            document.getElementById('adTitle').value = ad.title;
            document.getElementById('adCategory').value = ad.category;
            document.getElementById('adPrice').value = ad.price;
            document.getElementById('adPhone').value = ad.phone || "+994505458586";
            document.getElementById('adDescription').value = ad.description;
            document.getElementById('modalTitleText').innerText = "Elana Düzəliş Et (Admin)";

            currentEditingImages = [...(ad.images || [])];
            renderEditingThumbnails();

            closeDetailModal();
            openAddModal();
        };

        function renderEditingThumbnails() {
            const container = document.getElementById('imagePreviewContainer');
            const thumbs = document.getElementById('previewThumbnails');
            thumbs.innerHTML = '';

            if (currentEditingImages.length === 0) {
                container.style.display = 'none';
                return;
            }

            container.style.display = 'block';
            currentEditingImages.forEach((imgSrc, index) => {
                const div = document.createElement('div');
                div.className = "relative w-16 h-16 rounded-lg overflow-hidden border border-slate-300 group cursor-pointer flex-shrink-0";
                div.innerHTML = `
                    <img src="${imgSrc}" class="w-full h-full object-cover">
                    <div class="absolute inset-0 bg-red-600/70 opacity-0 group-hover:opacity-100 flex items-center justify-center text-white text-xs transition" title="Bu şəkli sil">
                        <i class="fa-solid fa-trash"></i>
                    </div>
                `;
                div.onclick = () => {
                    currentEditingImages.splice(index, 1);
                    renderEditingThumbnails();
                };
                thumbs.appendChild(div);
            });
        }

        window.filterAds = function() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const cat = document.getElementById('categorySelect').value;
            const sort = document.getElementById('sortSelect').value;

            let filtered = ads.filter(ad => {
                let matchesSearch = ad.title.toLowerCase().includes(search) || ad.description.toLowerCase().includes(search);
                let matchesCat = !currentCategoryTab || ad.category === currentCategoryTab;
                if (cat && ad.category !== cat) matchesCat = false;
                return matchesSearch && matchesCat;
            });

            if (sort === 'price-asc') filtered.sort((a,b) => a.price - b.price);
            if (sort === 'price-desc') filtered.sort((a,b) => b.price - a.price);

            renderAds(filtered);
        };

        function renderAds(list) {
            const grid = document.getElementById('listingsGrid');
            const empty = document.getElementById('emptyState');
            grid.innerHTML = '';

            if (list.length === 0) {
                empty.classList.remove('hidden');
                return;
            }
            empty.classList.add('hidden');

            list.forEach(ad => {
                const isFav = favorites.some(f => f.id === ad.id);
                const displayPhone = ad.phone || "+994505458586";
                const cleanPhone = displayPhone.replace(/[^0-9]/g,'');
                const mainImg = (ad.images && ad.images.length > 0) ? ad.images[0] : "https://images.unsplash.com/photo-1588702547919-26b89e033105?auto=format&fit=crop&w=600&q=80";
                
                const card = document.createElement('div');
                card.className = "bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-sm hover:shadow-md transition flex flex-col justify-between";
                card.innerHTML = `
                    <div class="relative h-48 cursor-pointer" onclick="openDetail('${ad.id}')">
                        <img src="${mainImg}" class="w-full h-full object-cover">
                        ${ad.images && ad.images.length > 1 ? `<span class="absolute top-3 left-3 bg-black/60 text-white text-[10px] px-2 py-0.5 rounded-md font-semibold"><i class="fa-solid fa-images"></i> ${ad.images.length}</span>` : ''}
                        <div class="absolute bottom-3 left-3 bg-black/65 backdrop-blur-sm text-white text-[11px] px-2.5 py-1 rounded-full flex items-center gap-1 font-medium">
                            <i class="fa-solid fa-eye text-emerald-400"></i> ${ad.views || 0} baxış
                        </div>
                        <button onclick="event.stopPropagation(); toggleFavorite('${ad.id}')" class="absolute top-3 right-3 w-9 h-9 rounded-full bg-white/80 backdrop-blur-sm flex items-center justify-center text-slate-700 hover:text-rose-500 transition">
                            <i class="fa-solid fa-heart ${isFav ? 'text-rose-500' : 'text-slate-400'}"></i>
                        </button>
                    </div>
                    <div class="p-5 flex-grow flex flex-col justify-between">
                        <div>
                            <div class="flex justify-between items-center mb-1">
                                <span class="text-xs font-semibold text-primary uppercase tracking-wider">${ad.category}</span>
                                <span class="text-[11px] font-bold text-slate-500"><i class="fa-solid fa-phone text-emerald-500"></i> ${displayPhone}</span>
                            </div>
                            <h3 class="font-bold text-slate-900 mt-1 cursor-pointer text-sm leading-snug" onclick="openDetail('${ad.id}')">${ad.title}</h3>
                            <p class="text-slate-500 text-xs mt-1.5 line-clamp-2 whitespace-pre-line">${ad.description}</p>
                        </div>
                        <div class="mt-4 pt-4 border-t border-slate-100 flex items-center justify-between">
                            <span class="text-lg font-extrabold text-slate-900">${ad.price.toLocaleString()} AZN</span>
                            <div class="flex items-center gap-2">
                                <a href="https://wa.me/${cleanPhone}?text=Salam, ${encodeURIComponent(ad.title)} elanı ilə maraqlanıram." target="_blank" onclick="event.stopPropagation()" class="bg-emerald-500 hover:bg-emerald-600 text-white w-8 h-8 rounded-lg flex items-center justify-center text-sm transition" title="WhatsApp">
                                    <i class="fa-brands fa-whatsapp"></i>
                                </a>
                                <button onclick="openDetail('${ad.id}')" class="bg-slate-100 hover:bg-slate-200 text-slate-800 px-3 py-1.5 rounded-lg text-xs font-semibold transition">Bax</button>
                            </div>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        window.setCategoryTab = function(cat) {
            currentCategoryTab = cat;
            document.querySelectorAll('.cat-tab').forEach(btn => {
                btn.className = "cat-tab px-5 py-2.5 rounded-xl text-sm font-semibold whitespace-nowrap transition bg-white border border-slate-200 text-slate-700 hover:bg-slate-100";
            });
            event.currentTarget.className = "cat-tab px-5 py-2.5 rounded-xl text-sm font-semibold whitespace-nowrap transition bg-primary text-white shadow-md shadow-primary/20";
            document.getElementById('categorySelect').value = cat;
            filterAds();
        };

        window.openDetail = async function(id) {
            const ad = ads.find(a => a.id === id);
            if (!ad) return;

            try {
                const adRef = doc(db, "ads", id);
                await updateDoc(adRef, { views: increment(1) });
                ad.views = (ad.views || 0) + 1;
            } catch (err) {
                console.error("View count update error:", err);
            }

            const displayPhone = ad.phone || "+994505458586";
            const cleanPhone = displayPhone.replace(/[^0-9]/g, '');
            const whatsappUrl = `https://wa.me/${cleanPhone}?text=Salam, ${encodeURIComponent(ad.title)} elanı ilə maraqlanıram.`;

            let imagesHTML = '';
            if (ad.images && ad.images.length > 0) {
                imagesHTML = `
                    <div class="mb-6">
                        <div class="relative h-80 rounded-2xl overflow-hidden bg-slate-100 mb-3 border border-slate-200">
                            <img id="mainDetailImg" src="${ad.images[0]}" onclick="openImageModal('${ad.images[0]}')" class="w-full h-full object-cover cursor-pointer hover:opacity-95 transition" title="Şəkilə tam ekran baxmaq üçün klikləyin">
                        </div>
                        ${ad.images.length > 1 ? `
                            <div class="flex gap-2 overflow-x-auto pb-2">
                                ${ad.images.map((img, idx) => `
                                    <img src="${img}" onclick="document.getElementById('mainDetailImg').src='${img}'" class="w-20 h-20 object-cover rounded-xl border-2 border-transparent hover:border-primary cursor-pointer transition flex-shrink-0">
                                `).join('')}
                            </div>
                        ` : ''}
                    </div>
                `;
            }

            const content = document.getElementById('detailContent');
            content.innerHTML = `
                ${imagesHTML}
                <div class="flex justify-between items-start mb-4">
                    <div>
                        <span class="text-xs font-semibold text-primary uppercase">${ad.category}</span>
                        <h2 class="text-2xl font-bold text-slate-900 mt-1 leading-snug">${ad.title}</h2>
                        <div class="flex items-center gap-4 mt-2">
                            <span class="text-xs text-slate-400"><i class="fa-solid fa-eye text-emerald-500"></i> Bu elana ${ad.views || 1} dəfə baxılıb</span>
                            <span class="text-xs font-bold text-slate-700"><i class="fa-solid fa-phone text-emerald-500"></i> ${displayPhone}</span>
                        </div>
                    </div>
                    <span class="text-2xl font-black text-slate-900 whitespace-nowrap ml-4">${ad.price.toLocaleString()} AZN</span>
                </div>
                <p class="text-slate-600 text-sm leading-relaxed mb-6 whitespace-pre-line bg-slate-50 p-4 rounded-xl border border-slate-100">${ad.description}</p>
                <div class="flex items-center justify-between pt-4 border-t border-slate-200 flex-wrap gap-4">
                    <div class="flex items-center space-x-3">
                        <a href="tel:${displayPhone}" class="bg-primary hover:bg-emerald-600 text-white px-5 py-3 rounded-xl font-semibold text-sm flex items-center space-x-2 shadow-lg shadow-primary/30 transition">
                            <i class="fa-solid fa-phone"></i>
                            <span>Zəng et</span>
                        </a>
                        <a href="${whatsappUrl}" target="_blank" class="bg-emerald-500 hover:bg-emerald-600 text-white px-5 py-3 rounded-xl font-semibold text-sm flex items-center space-x-2 transition">
                            <i class="fa-brands fa-whatsapp text-lg"></i>
                            <span>WhatsApp-a Yaz</span>
                        </a>
                    </div>
                    ${currentUser ? `
                        <div class="flex items-center space-x-2">
                            <button onclick="editAd('${ad.id}')" class="bg-blue-50 hover:bg-blue-100 text-blue-600 px-4 py-3 rounded-xl font-semibold text-sm transition flex items-center gap-1.5"><i class="fa-solid fa-pen-to-square"></i> Düzəliş et</button>
                            <button onclick="deleteAd('${ad.id}')" class="bg-rose-50 hover:bg-rose-100 text-rose-600 px-4 py-3 rounded-xl font-semibold text-sm transition" title="Elanı sil"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    ` : ''}
                </div>
            `;
            document.getElementById('detailModal').classList.remove('hidden');
        };

        window.closeDetailModal = () => document.getElementById('detailModal').classList.add('hidden');
        
        window.openImageModal = (imgSrc) => {
            document.getElementById('fullscreenImg').src = imgSrc;
            document.getElementById('imageModal').classList.remove('hidden');
        };

        window.closeImageModal = () => {
            document.getElementById('imageModal').classList.add('hidden');
        };

        window.openAddModal = () => {
            if(!document.getElementById('editingAdId').value) {
                document.getElementById('addAdForm').reset();
                document.getElementById('adPhone').value = "+994505458586";
                document.getElementById('modalTitleText').innerText = "Yeni Elan Yerləşdir (Admin)";
                currentEditingImages = [];
                renderEditingThumbnails();
            }
            document.getElementById('addModal').classList.remove('hidden');
        };

        window.closeAddModal = () => {
            document.getElementById('editingAdId').value = '';
            currentEditingImages = [];
            document.getElementById('addModal').classList.add('hidden');
        };

        window.openFavoritesModal = () => {
            renderFavorites();
            document.getElementById('favoritesModal').classList.remove('hidden');
        };
        window.closeFavoritesModal = () => document.getElementById('favoritesModal').classList.add('hidden');

        window.toggleFavorite = function(id) {
            const ad = ads.find(a => a.id === id);
            if (!ad) return;
            const index = favorites.findIndex(f => f.id === id);
            if (index > -1) {
                favorites.splice(index, 1);
            } else {
                favorites.push(ad);
            }
            localStorage.setItem('sumqayit_favs', JSON.stringify(favorites));
            updateFavCount();
            filterAds();
        };

        function updateFavCount() {
            document.getElementById('favCount').innerText = favorites.length;
        }

        function renderFavorites() {
            const list = document.getElementById('favoritesList');
            list.innerHTML = '';
            if (favorites.length === 0) {
                list.innerHTML = `<p class="text-center text-slate-500 py-8">Seçilmiş elan yoxdur.</p>`;
                return;
            }
            favorites.forEach(ad => {
                const mainImg = (ad.images && ad.images.length > 0) ? ad.images[0] : "https://images.unsplash.com/photo-1588702547919-26b89e033105?auto=format&fit=crop&w=600&q=80";
                const item = document.createElement('div');
                item.className = "flex items-center justify-between p-3 bg-slate-50 rounded-xl border border-slate-200";
                item.innerHTML = `
                    <div class="flex items-center space-x-3 cursor-pointer" onclick="closeFavoritesModal(); openDetail('${ad.id}')">
                        <img src="${mainImg}" class="w-16 h-16 object-cover rounded-lg">
                        <div>
                            <h4 class="font-bold text-sm text-slate-900 line-clamp-1">${ad.title}</h4>
                            <span class="text-xs font-bold text-slate-700">${ad.price.toLocaleString()} AZN</span>
                        </div>
                    </div>
                    <button onclick="toggleFavorite('${ad.id}'); renderFavorites();" class="text-rose-500 hover:text-rose-700 p-2"><i class="fa-solid fa-trash"></i></button>
                `;
                list.appendChild(item);
            });
        }

        window.resetFilters = function() {
            document.getElementById('searchInput').value = '';
            document.getElementById('categorySelect').value = '';
            document.getElementById('sortSelect').value = 'newest';
            currentCategoryTab = '';
            filterAds();
        };

        initStats();
        listenToAds();
    </script>
</body>
</html>
