<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sumqayıt Elan Kataloqu</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 min-h-screen">

    <!-- Header -->
    <header class="bg-blue-600 text-white shadow-md">
        <div class="container mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold"><i class="fa-solid fa-house-chimney mr-2"></i>Sumqayıt Elanlar</h1>
            <div id="auth-container">
                <button id="login-btn" onclick="loginWithGoogle()" class="bg-white text-blue-600 px-4 py-2 rounded-lg font-semibold shadow hover:bg-gray-100 transition">
                    <i class="fa-brands fa-google mr-2"></i>Giriş Et
                </button>
                <div id="user-info" class="hidden flex items-center space-x-3">
                    <span id="user-name" class="font-medium"></span>
                    <button onclick="logout()" class="bg-red-500 text-white px-3 py-1 rounded text-sm hover:bg-red-600">Çıxış</button>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="container mx-auto px-4 py-6">
        
        <!-- Elan Əlavə Etmə Bölməsi -->
        <div class="bg-white p-6 rounded-xl shadow-md mb-8">
            <h2 class="text-lg font-bold mb-4 text-gray-800"><i class="fa-solid fa-plus-circle mr-2 text-blue-600"></i>Yeni Elan Əlavə Et</h2>
            <form id="ad-form" onsubmit="submitAd(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Elan Başlığı</label>
                    <input type="text" id="ad-title" required class="w-full border rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Məsələn: 2 otaqlı mənzil">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Ətraflı Məlumat</label>
                    <textarea id="ad-desc" rows="3" required class="w-full border rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Məlumat daxil edin..."></textarea>
                </div>
                
                <!-- Şəkil Seçmə və Kamera -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Şəkil Seç və ya Kamera ilə Çək</label>
                    <div class="flex flex-wrap gap-3 items-center">
                        <input type="file" id="ad-image-input" accept="image/*" class="border rounded-lg px-3 py-2 text-sm w-full sm:w-auto">
                        <button type="button" onclick="openCameraModal()" class="bg-gray-800 text-white px-4 py-2 rounded-lg text-sm hover:bg-gray-700 transition">
                            <i class="fa-solid fa-camera mr-2"></i>Kamera ilə Çək
                        </button>
                    </div>
                    <!-- Şəkil Önizləmə -->
                    <div id="image-preview-container" class="mt-3 hidden">
                        <img id="image-preview" src="" alt="Önizləmə" class="h-32 object-cover rounded-lg border">
                    </div>
                </div>

                <button type="submit" id="submit-btn" class="w-full bg-blue-600 text-white font-semibold py-2 rounded-lg hover:bg-blue-700 transition">
                    Elanı Paylaş
                </button>
            </form>
        </div>

        <!-- Elanların Siyahısı -->
        <h2 class="text-xl font-bold mb-4 text-gray-800">Paylaşılan Elanlar</h2>
        <div id="ads-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Elanlar burada göstəriləcək -->
        </div>
    </main>

    <!-- Kamera Modalı -->
    <div id="camera-modal" class="fixed inset-0 bg-black bg-opacity-70 hidden flex justify-center items-center z-50 p-4">
        <div class="bg-white rounded-xl p-4 max-w-md w-full text-center relative">
            <h3 class="font-bold text-lg mb-2">Kamera ilə Şəkil Çək</h3>
            <div class="relative overflow-hidden rounded-lg bg-black aspect-video flex justify-center items-center">
                <video id="camera-video" autoplay playsinline class="w-full h-full object-cover"></video>
            </div>
            <canvas id="camera-canvas" class="hidden"></canvas>
            <div class="mt-4 flex justify-center space-x-3">
                <button type="button" onclick="takeSnapshot()" class="bg-green-600 text-white px-4 py-2 rounded-lg font-semibold hover:bg-green-700">
                    <i class="fa-solid fa-camera mr-1"></i> Şəkil Çək
                </button>
                <button type="button" onclick="closeCameraModal()" class="bg-gray-500 text-white px-4 py-2 rounded-lg hover:bg-gray-600">
                    Bağla
                </button>
            </div>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, getDocs, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // Firebase Konfiqurasiyanız
        const firebaseConfig = {
            apiKey: "AIzaSyCwqM_2qvOX99DNTu9nAClaT9KVSSOl0h0", 
            authDomain: "elanlar-ff4cb.firebaseapp.com",
            projectId: "elanlar-ff4cb",
            storageBucket: "elanlar-ff4cb.firebasestorage.app",
            messagingSenderId: "593281324616",
            appId: "1:593281324616:web:7ce0215af0bb9c5c422a7d",
            measurementId: "G-EHHSNEM0SV"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let base64ImageString = "";

        window.loginWithGoogle = async () => {
            const provider = new GoogleAuthProvider();
            try {
                await signInWithPopup(auth, provider);
            } catch (error) {
                alert("Giriş xətası: " + error.message);
            }
        };

        window.logout = () => {
            signOut(auth);
        };

        onAuthStateChanged(auth, (user) => {
            const loginBtn = document.getElementById('login-btn');
            const userInfo = document.getElementById('user-info');
            const userName = document.getElementById('user-name');

            if (user) {
                loginBtn.classList.add('hidden');
                userInfo.classList.remove('hidden');
                userName.textContent = user.displayName;
            } else {
                loginBtn.classList.remove('hidden');
                userInfo.classList.add('hidden');
            }
        });

        // Şəklin ölçüsünü və həcmini kiçildən funksiya (Timeout xətasını önləyir)
        function resizeImage(fileOrDataUrl) {
            return new Promise((resolve) => {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 800;
                    const MAX_HEIGHT = 800;
                    let width = img.width;
                    let height = img.height;

                    if (width > height) {
                        if (width > MAX_WIDTH) {
                            height *= MAX_WIDTH / width;
                            width = MAX_WIDTH;
                        }
                    } else {
                        if (height > MAX_HEIGHT) {
                            width *= MAX_HEIGHT / height;
                            height = MAX_HEIGHT;
                        }
                    }

                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    
                    resolve(canvas.toDataURL('image/jpeg', 0.7)); // 70% keyfiyyət - çox sürətli yüklənir
                };
                
                if (typeof fileOrDataUrl === 'string') {
                    img.src = fileOrDataUrl;
                } else {
                    const reader = new FileReader();
                    reader.onload = (e) => { img.src = e.target.result; };
                    reader.readAsDataURL(fileOrDataUrl);
                }
            });
        }

        // Fayl seçildikdə
        const imageInput = document.getElementById('ad-image-input');
        imageInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (file) {
                base64ImageString = await resizeImage(file);
                document.getElementById('image-preview').src = base64ImageString;
                document.getElementById('image-preview-container').classList.remove('hidden');
            }
        });

        // Elanı göndərmək
        window.submitAd = async (e) => {
            e.preventDefault();
            const title = document.getElementById('ad-title').value;
            const desc = document.getElementById('ad-desc').value;
            const submitBtn = document.getElementById('submit-btn');

            if (!auth.currentUser) {
                alert("Elan yerləşdirmək üçün əvvəlcə giriş etməlisiniz!");
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = "Elan yerləşdirilir...";

            try {
                await addDoc(collection(db, "ads"), {
                    title: title,
                    description: desc,
                    imageUrl: base64ImageString || "",
                    userEmail: auth.currentUser.email,
                    userName: auth.currentUser.displayName,
                    createdAt: serverTimestamp()
                });

                alert("Elan uğurla yerləşdirildi!");
                document.getElementById('ad-form').reset();
                document.getElementById('image-preview-container').classList.add('hidden');
                base64ImageString = "";
                loadAds();
            } catch (error) {
                alert("Xəta baş verdi: " + error.message);
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = "Elanı Paylaş";
            }
        };

        // Elanları yükləmək
        async function loadAds() {
            const adsGrid = document.getElementById('ads-grid');
            adsGrid.innerHTML = "<p class='text-gray-500'>Elanlar yüklənir...</p>";

            try {
                const q = query(collection(db, "ads"), orderBy("createdAt", "desc"));
                const querySnapshot = await getDocs(q);
                
                adsGrid.innerHTML = "";
                if (querySnapshot.empty) {
                    adsGrid.innerHTML = "<p class='text-gray-500'>Hələ heç bir elan yoxdur.</p>";
                    return;
                }

                querySnapshot.forEach((doc) => {
                    const ad = doc.data();
                    const card = document.createElement('div');
                    card.className = "bg-white rounded-xl shadow-md overflow-hidden border";
                    card.innerHTML = `
                        ${ad.imageUrl ? `<img src="${ad.imageUrl}" alt="Elan şəkli" class="w-full h-48 object-cover">` : ''}
                        <div class="p-4">
                            <h3 class="font-bold text-lg text-gray-800 mb-1">${escapeHtml(ad.title)}</h3>
                            <p class="text-gray-600 text-sm mb-3">${escapeHtml(ad.description)}</p>
                            <div class="text-xs text-gray-400 flex justify-between items-center border-t pt-2">
                                <span>Paylaşdı: ${escapeHtml(ad.userName || 'İstifadəçi')}</span>
                            </div>
                        </div>
                    `;
                    adsGrid.appendChild(card);
                });
            } catch (error) {
                adsGrid.innerHTML = "<p class='text-red-500'>Elanları yükləmək mümkün olmadı.</p>";
            }
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        loadAds();
    </script>

    <!-- Kamera Skriptləri -->
    <script>
        let videoStream = null;

        async function openCameraModal() {
            const modal = document.getElementById('camera-modal');
            const video = document.getElementById('camera-video');
            modal.classList.remove('hidden');
            try {
                videoStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false });
                video.srcObject = videoStream;
            } catch (err) {
                alert("Kameraya giriş icazəsi verilmədi və ya kamera tapılmadı.");
                closeCameraModal();
            }
        }

        function closeCameraModal() {
            const modal = document.getElementById('camera-modal');
            modal.classList.add('hidden');
            if (videoStream) {
                videoStream.getTracks().forEach(track => track.stop());
                videoStream = null;
            }
        }

        async function takeSnapshot() {
            const video = document.getElementById('camera-video');
            const canvas = document.getElementById('camera-canvas');
            canvas.width = video.videoWidth || 640;
            canvas.height = video.videoHeight || 480;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            const rawSnapshot = canvas.toDataURL('image/jpeg');
            // Kameradan çəkilən şəkli də sıxışdırırıq
            base64ImageString = await resizeImage(rawSnapshot);

            document.getElementById('image-preview').src = base64ImageString;
            document.getElementById('image-preview-container').classList.remove('hidden');
            
            closeCameraModal();
        }
    </script>
</body>
</html>
